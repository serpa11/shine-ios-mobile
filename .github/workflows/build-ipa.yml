name: Build IPA

# Runs on a cloud Mac, so you never need one. The build is deliberately
# UNSIGNED: Apple refuses to sign anything without a Team ID, and an unsigned
# IPA is still installable by re-signing it with your own Apple ID through
# Sideloadly / AltStore on Windows.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile for iOS (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Shine.xcodeproj \
            -scheme Shine \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package as IPA
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "No .app was produced - check the build step above." >&2
            exit 1
          fi
          echo "Packaging $APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry "$GITHUB_WORKSPACE/Shine-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"

      - name: Sanity check
        run: |
          set -euo pipefail
          unzip -l Shine-unsigned.ipa

          # Locate the bundle executable rather than hardcoding the path: the
          # .app name comes from the target and could change.
          BIN=$(unzip -Z1 Shine-unsigned.ipa | grep -E '^Payload/[^/]+\.app/[^/]+$' | head -1)
          if [ -z "$BIN" ]; then
            echo "Could not find a bundle executable in the IPA." >&2
            exit 1
          fi
          echo "bundle executable: $BIN"

          # The IPA is useless without a real Mach-O binary inside.
          DESC=$(unzip -p Shine-unsigned.ipa "$BIN" | file -)
          echo "$DESC"
          case "$DESC" in
            *Mach-O*) ;;
            *) echo "$BIN is not a Mach-O binary." >&2; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: Shine-unsigned-ipa
          path: Shine-unsigned.ipa
          if-no-files-found: error
